[tool.poetry]
name = "alpha-assay"
version = "0.1.0"
description = "Multi-agent paper replication and out-of-sample validation pipeline"
authors = []
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.0"
pydantic-settings = "^2.0"
typer = "^0.12"
rich = "^13.0"
httpx = "^0.27"
requests = "^2.31"
PyMuPDF = "^1.24"
beautifulsoup4 = "^4.12"
jinja2 = "^3.1"
python-dotenv = "^1.0"
GitPython = "^3.1"
pyyaml = "^6.0"
openai = "^1.30"
textual = ">=0.80"
Pillow = ">=10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0"
ruff = "^0.3"

[tool.poetry.scripts]
alpha-assay = "app.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
